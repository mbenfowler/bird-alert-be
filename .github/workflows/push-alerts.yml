name: Push alerts

# Vercel Hobby crons run at most daily, so this workflow drives the hourly watch-list push. The health step
# doubles as an uptime monitor: a failed run emails the repository owner.
# Needs the CRON_SECRET repository secret, equal to the backend's CRON_SECRET env var.
# When: cron-job.org starts this through GitHub's workflow_dispatch API (POST .../actions/workflows/<file>/dispatches
# with a fine-grained token that can only run Actions here), because GitHub delays or drops scheduled runs. The
# schedule below stays as a backup; every job is safe to run twice.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Health check (API and app)
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 'https://bird-alert-be.vercel.app/api?strict=1'
          echo
          curl --fail --silent --show-error --max-time 30 -o /dev/null -w 'app: HTTP %{http_code}\n' https://bird-alert.vercel.app/
      - name: Call the push alerts endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo "CRON_SECRET secret is not set"; exit 1; }
          # Each call works for 45 seconds and says where it stopped; repeat until it is done.
          after=0
          for i in $(seq 1 20); do
            out=$(curl --fail-with-body --silent --show-error --max-time 120 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://bird-alert-be.vercel.app/api/push/alerts?after=$after")
            echo "$out" | head -c 400; echo
            echo "$out" | grep -q '"more":true' || break
            after=$(echo "$out" | grep -o '"next":[0-9]*' | cut -d: -f2)
          done
      - name: Sync the regions' checklists
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Each call works for 45 seconds, oldest-synced region first, and says "more" if regions
          # are left; repeat until done.
          for i in $(seq 1 10); do
            out=$(curl --fail-with-body --silent --show-error --max-time 120 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://bird-alert-be.vercel.app/api/ebird/sync-checklists")
            echo "$out" | head -c 600; echo
            echo "$out" | grep -q '"more":true' || break
          done
      - name: Remind new accounts to confirm their email
        # Runs even if a step above failed: a reminder doesn't depend on the push or the sync.
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://bird-alert-be.vercel.app/api/mail/reminders"
          echo
